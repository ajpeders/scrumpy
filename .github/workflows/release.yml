# Mirror of .forgejo/workflows/release.yml for the GitHub repository.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
      - name: Vet
        # Same gate as Forgejo: a failing vet fails the release before any
        # asset gets uploaded.
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Build
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-X main.version=${GITHUB_REF_NAME}" \
              -o "sidecue-linux-${arch}" .
          done
          sha256sum sidecue-linux-amd64 sidecue-linux-arm64 > SHA256SUMS
      - name: Publish release
        # GitHub's asset upload API (uploads.github.com, raw body) differs
        # from Forgejo's, so use gh instead of publish-release.sh. Create
        # only if missing and --clobber uploads, so a re-run after a
        # partial failure is safe.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --verify-tag
          gh release upload "$tag" --clobber \
            sidecue-linux-amd64 sidecue-linux-arm64 SHA256SUMS
