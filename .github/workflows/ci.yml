# Mirror of .forgejo/workflows/ci.yml for the GitHub repository.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        # release_workflow_test.go exercises .forgejo/scripts/publish-release.sh
        # which uses jq to parse the release JSON. Install it here so CI
        # exercises the same path production runs on.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
