name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The runner's tool cache is empty; use a Go job container and check out
    # directly from Forgejo rather than relying on actions/checkout.
    container: golang:1.27
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "http://token:${TOKEN}@forgejo:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install jq
        # release_workflow_test.go exercises .forgejo/scripts/publish-release.sh
        # which uses jq to parse the release JSON. Install it here so CI
        # exercises the same path production runs on.
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          fi
      - name: Strip PR credentials
        # The job token has read access to the source repo and may have more
        # on a PR from a fork. Strip it from .git/config before any user-
        # controlled code (tests, fuzzers, examples) runs, so a malicious
        # contribution can't reuse it to push back to the project or read
        # other refs. The unauthenticated URL below fails fast if a test
        # somehow tries to fetch.
        run: |
          git config --unset-all remote.origin.url || true
          git config --add remote.origin.url "http://forgejo:3000/${GITHUB_REPOSITORY}.git"
          # Belt and braces: assert no credential embedded in the URL.
          if git config --get remote.origin.url | grep -q '@'; then
            echo "remote URL still contains credentials" >&2
            git config --get remote.origin.url >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...