name: release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "http://token:${TOKEN}@forgejo:3000/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install jq
        # The Go image's busybox build doesn't ship jq, but the Forgejo release
        # API needs a JSON parser to read the upload id (sed on the response
        # body can grab the wrong id when notes mention releases).
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq jq
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        # The tag pipeline runs the same suite as a regular CI push, so a
        # failing test or vet error fails the release before any asset gets
        # uploaded. Tag pushes go to a single environment with the release
        # token, so a bad build shouldn't reach the world.
        run: go test -race ./...
      - name: Build
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-X main.version=${GITHUB_REF_NAME}" \
              -o "sidecue-linux-${arch}" .
          done
          sha256sum sidecue-linux-amd64 sidecue-linux-arm64 > SHA256SUMS
      - name: Publish release
        env:
          # Secret RELEASE_TOKEN (Forgejo access token, write:repository) is
          # used if set; otherwise the job token is tried.
          TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          api="http://forgejo:3000/api/v1/repos/${GITHUB_REPOSITORY}/releases"
          # The script does the lookup-then-create dance and skips any
          # assets already on the release, so a re-run after a partial
          # upload failure doesn't duplicate anything.
          bash .forgejo/scripts/publish-release.sh \
              "$api" "${TOKEN}" "${GITHUB_REF_NAME}" \
              sidecue-linux-amd64 sidecue-linux-arm64 SHA256SUMS